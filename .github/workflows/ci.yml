name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        # Wrangler (`wrangler types` in the armory's type-check) sends usage
        # metrics unless told not to, and checks npm for a newer version to
        # print in its banner; hiding the banner skips that check.
        env:
            WRANGLER_SEND_METRICS: 'false'
            WRANGLER_HIDE_BANNER: 'true'
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # `bunx react-router` and `bunx wrangler` (the armory planner's
            # build and type-check) run under Node (their bins start with
            # `#!/usr/bin/env node`), and React Router 8 requires Node >= 22.22,
            # newer than some runner images ship. v7 (as jre-web) runs on the
            # node24 Actions runtime; no npm cache, Bun installs here.
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  package-manager-cache: false

            - run: bun install --frozen-lockfile

            # Go builds the browser sim (packages/sim) to WASM in
            # `bun run check`: the version upstream's go.mod names.
            - uses: actions/setup-go@v5
              with:
                  go-version-file: packages/sim/upstream/go.mod
                  cache-dependency-path: packages/sim/upstream/go.sum

            # LuaLS, the WoW API annotations and Forever's API docs, pinned in
            # fetch-tools.ts. A pin change changes the key.
            - uses: actions/cache@v4
              with:
                  path: .tools
                  key: lua-tools-${{ runner.os }}-${{ hashFiles('packages/addon/scripts/fetch-tools.ts') }}

            # The one entry point: type-check, lint, syncpack, the sim's build,
            # Go checks and tests (check:all), then the Lua checks (lua:all):
            # fetch the tools if the cache missed, StyLua format check, LuaLS,
            # the secret-read guard, and the tests.
            - run: bun run check

    # Upstream WoWSims's full Go test suite, on the vendored copy.
    sim-go-test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: packages/sim/upstream
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: packages/sim/upstream/go.mod
                  cache-dependency-path: packages/sim/upstream/go.sum

            - run: go test -tags with_db ./sim/...

    # Packages the addon the way release.yml does, uploading nothing, and
    # fails if anything outside the addon folder got into the zip.
    package:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # The packager's manual changelog; before the first release there
            # is no changelog yet, so a stand-in.
            - name: Write the release notes
              run: |
                  if [ -f packages/addon/CHANGELOG.md ]; then
                    bun packages/addon/scripts/release-notes.ts packages/addon/CHANGELOG.md > packages/addon/Turbo/CHANGELOG.md
                  else
                    echo "Unreleased." > packages/addon/Turbo/CHANGELOG.md
                  fi

            # The packager only takes a top dir with a .git folder in it. An
            # empty one is enough: git skips it and still finds the repo above.
            - name: Mark the addon folder as the packager's top dir
              run: mkdir -p packages/addon/Turbo/.git

            - name: Package without uploading
              uses: BigWigsMods/packager@v2
              with:
                  args: -d -t packages/addon/Turbo -m packages/addon/.pkgmeta

            - name: Check the packaged zip
              run: bun packages/addon/scripts/check-package.ts packages/addon/Turbo/.release/*.zip
