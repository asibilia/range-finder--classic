name: Require Changesets

on:
    pull_request:
        branches: [main]

jobs:
    check-changesets:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  # Full history, so the PR can be diffed against its base.
                  fetch-depth: 0

            - name: Check for changesets
              run: |
                  # A Version PR opened by changesets/action carries the
                  # "automated" label. It consumes changesets rather than
                  # adding one, so requiring a changeset there would deadlock
                  # the release: no release could ever merge.
                  LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
                  if echo "$LABELS" | grep -q "^automated$"; then
                    echo "✓ Automated Version PR — changesets not required"
                    exit 0
                  fi

                  # Count only the changesets this PR adds. In pre-release
                  # (beta) mode, `changeset version` keeps consumed
                  # changesets in .changeset/ and lists them in pre.json, so
                  # counting every file there would pass any PR.
                  COUNT=$(git diff --name-only --diff-filter=A \
                    "$BASE_SHA...HEAD" -- '.changeset/*.md' \
                    | grep -v '^\.changeset/README\.md$' | grep -c . || true)

                  if [ "$COUNT" -eq 0 ]; then
                    echo "❌ This PR adds no changeset to .changeset/"
                    echo ""
                    echo "Every PR into main needs at least one changeset, or the"
                    echo "release notes silently lose this change."
                    echo ""
                    echo "  bun run changeset"
                    echo ""
                    echo "Pick @goturbo/addon and/or @goturbo/web, choose a bump,"
                    echo "and commit the generated .changeset/*.md file."
                    exit 1
                  fi

                  echo "✓ This PR adds $COUNT changeset file(s)"
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
